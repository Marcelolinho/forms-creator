services:
  app:
    build: .
    ports:
      - "8000:8080"
    container_name: forms-application
    depends_on:
      - ngrok
    volumes:
      - forms-tokens:/app/data/tokens

  ngrok:
    image: ngrok/ngrok:latest
    container_name: forms-application-ngrok
    command: http app:8080
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}

volumes:
  forms-tokens: